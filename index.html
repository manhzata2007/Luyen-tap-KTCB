<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Luyện tập kiểm thử cơ bản</title>
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #eef1fb;
        --card: #fff;
        --tx: #1b2033;
        --mu: #64708a;
        --bd: #d8def0;
        --ok: #0f9d6b;
        --er: #d6336c;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #12152a;
          --card: #1c2140;
          --tx: #eef0fb;
          --mu: #a2abc9;
          --bd: #323a66;
          --ok: #3ddba0;
          --er: #ff7aa8;
        }
      }
      :root[data-theme="dark"] {
        --bg: #12152a;
        --card: #1c2140;
        --tx: #eef0fb;
        --mu: #a2abc9;
        --bd: #323a66;
        --ok: #3ddba0;
        --er: #ff7aa8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      .hero {
        background: linear-gradient(120deg, #4263eb, #9c36b5 55%, #f76707);
        color: #fff;
        padding: 22px 16px;
      }
      .hero h1 {
        margin: 0;
        font-size: 23px;
      }
      .hero p {
        margin: 4px 0 0;
        opacity: 0.92;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 14px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px;
      }
      input,
      select {
        font: inherit;
        color: var(--tx);
        background: var(--bg);
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 7px 9px;
        width: 100%;
      }
      input:focus,
      select:focus {
        outline: 2px solid var(--c, #4263eb);
        border-color: transparent;
      }
      .g {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 8px;
        margin: 10px 0;
      }
      .bt {
        font: inherit;
        border: 0;
        border-radius: 8px;
        padding: 9px 16px;
        cursor: pointer;
        color: #fff;
        background: var(--c, #4263eb);
        font-weight: 600;
      }
      .bt.s {
        background: var(--card);
        color: var(--tx);
        border: 1px solid var(--bd);
      }
      .bar {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        background: var(--card);
        border-bottom: 3px solid #4263eb;
        padding: 8px 14px;
      }
      .clock {
        font:
          700 24px ui-monospace,
          Menlo,
          monospace;
        color: #4263eb;
      }
      .clock.w {
        color: var(--er);
        animation: bl 1s infinite;
      }
      @keyframes bl {
        50% {
          opacity: 0.45;
        }
      }
      .tabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        margin: 12px 0;
      }
      .tab {
        flex: 1;
        min-width: 135px;
        padding: 9px 11px;
        border: 2px solid var(--bd);
        background: var(--card);
        color: var(--tx);
        border-radius: 10px;
        cursor: pointer;
        font: inherit;
        text-align: left;
        border-top: 5px solid var(--c);
      }
      .tab.on {
        background: var(--c);
        color: #fff;
        border-color: var(--c);
      }
      .tab small {
        display: block;
        opacity: 0.85;
      }
      .sp {
        border-left: 5px solid var(--c);
        background: color-mix(in srgb, var(--c) 9%, var(--card));
      }
      .sp ul {
        margin: 6px 0 0;
        padding-left: 20px;
      }
      .tw {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 560px;
      }
      th,
      td {
        border: 1px solid var(--bd);
        padding: 4px;
        text-align: left;
      }
      th {
        background: var(--c);
        color: #fff;
        font-size: 13px;
      }
      td.st {
        font-size: 13px;
        white-space: nowrap;
      }
      .ok {
        color: var(--ok);
      }
      .er {
        color: var(--er);
      }
      .sc {
        display: flex;
        gap: 16px;
        align-items: center;
        flex-wrap: wrap;
      }
      .big {
        font: 800 52px/1 system-ui;
        background: linear-gradient(120deg, #4263eb, #9c36b5, #f76707);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .pb {
        height: 10px;
        border-radius: 9px;
        background: var(--bd);
        overflow: hidden;
        margin: 6px 0;
      }
      .pb i {
        display: block;
        height: 100%;
        background: var(--c);
      }
      .rc {
        border-top: 5px solid var(--c);
      }
      .rc h3 {
        margin: 0;
      }
      .rc ul {
        margin: 4px 0;
        padding-left: 20px;
      }
      .tag {
        display: inline-block;
        background: var(--c);
        color: #fff;
        border-radius: 99px;
        padding: 1px 10px;
        font-size: 13px;
        font-weight: 700;
      }
      .r {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .ro {
        pointer-events: none;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <h1>Luyện tập kiểm thử phần mềm cơ bản</h1>
      <p>
        Phân vùng tương đương · Giá trị biên · Bảng quyết định · Đoán lỗi — Thời
        gian làm bài: 40 phút
      </p>
    </div>
    <div id="app"></div>
    <script>
      const TOTAL = 2400,
        KEY = "lab34v4";
      const cls = (v) => {
        const s = String(v).trim();
        if (s === "" || isNaN(Number(s))) return "Không phải số";
        const n = +s;
        return n < 0
          ? "< 0"
          : n > 10
            ? "> 10"
            : n < 5
              ? "Yếu"
              : n < 7
                ? "Trung bình"
                : n < 8.5
                  ? "Khá"
                  : "Giỏi";
      };
      const expEP = (v) => {
        const c = cls(v);
        return ["Yếu", "Trung bình", "Khá", "Giỏi"].includes(c)
          ? c
          : "Không hợp lệ";
      };
      const EPC = [
        "< 0",
        "Yếu",
        "Trung bình",
        "Khá",
        "Giỏi",
        "> 10",
        "Không phải số",
      ];
      const POS = {
        17: "min-1",
        18: "min",
        19: "min+1",
        59: "max-1",
        60: "max",
        61: "max+1",
      };
      const POSY = {
        0: "min-1",
        1: "min",
        2: "min+1",
        19: "max-1",
        20: "max",
        21: "max+1",
      };
      const vcls = (v) => {
        const s = String(v).trim();
        if (s === "" || isNaN(Number(s)) || !Number.isInteger(+s))
          return "Không phải số nguyên";
        const n = +s;
        return n < 0 ? "< 0" : n > 10 ? "> 10" : n <= 3 ? "0–3" : "4–10";
      };
      const expEP2 = (b, d) => {
        const vc = vcls(d);
        if (["< 0", "> 10", "Không phải số nguyên"].includes(vc))
          return "Không hợp lệ";
        const e = expEP(b);
        return e != "Không hợp lệ" && vc == "4–10" ? "Cấm thi" : e;
      };
      const bvaOK = (v) => {
        const s = String(v).trim();
        return s !== "" && Number.isInteger(+s) && +s >= 18 && +s <= 60
          ? "Hợp lệ"
          : "Không hợp lệ";
      };
      const disc = (m, q, c) =>
        Math.min(15, 10 * (m == "T") + 5 * (q == "T") + 5 * (c == "T")) + "%";
      const combos = [];
      for (const m of "TF")
        for (const q of "TF") for (const c of "TF") combos.push(m + q + c);
      const TABS = {
        ep: {
          c: "#4263eb",
          name: "1. Phân vùng tương đương",
          spec: [
            "<b>Chức năng:</b> xét kết quả học phần dựa trên 2 dữ liệu vào: <b>điểm trung bình</b> (số thực) và <b>số buổi vắng</b> (số nguyên).",
            'Điểm: 0 ≤ điểm &lt; 5: Yếu · 5 ≤ điểm &lt; 7: Trung bình · 7 ≤ điểm &lt; 8.5: Khá · 8.5 ≤ điểm ≤ 10: Giỏi. Số buổi vắng hợp lệ từ 0 đến 10: vắng từ 0 đến 3 buổi thì xếp loại theo điểm; vắng từ 4 đến 10 buổi thì "Cấm thi".',
            'Điểm hoặc số buổi vắng nằm ngoài khoảng, hoặc không phải số (số buổi vắng phải là số nguyên): "Không hợp lệ".',
            "<b>Yêu cầu:</b> tự xác định các lớp tương đương (hợp lệ và không hợp lệ) của <b>từng</b> dữ liệu vào, mô tả ở cột đầu, chọn giá trị đại diện cho mỗi test case và điền kết quả mong đợi. Mỗi lớp cần ít nhất 1 test case.",
          ],
          cols: [
            {
              k: "a",
              l: "Lớp tương đương (tự xác định)",
              ph: "Mô tả lớp mà test case này đại diện",
            },
            { k: "b", l: "Điểm trung bình", ph: "Nhập giá trị", opt: 1 },
            { k: "d", l: "Số buổi vắng", ph: "Nhập giá trị", opt: 1 },
            {
              k: "c",
              l: "Kết quả mong đợi",
              sel: [
                "Yếu",
                "Trung bình",
                "Khá",
                "Giỏi",
                "Cấm thi",
                "Không hợp lệ",
              ],
            },
          ],
          req: EPC.map((x) => "Điểm: " + x).concat(
            ["< 0", "0–3", "4–10", "> 10", "Không phải số nguyên"].map(
              (x) => "Vắng: " + x,
            ),
          ),
          key: (r) => {
            if (r.c !== expEP2(r.b, r.d)) return null;
            const vc = vcls(r.d),
              bc = cls(r.b),
              vI = ["< 0", "> 10", "Không phải số nguyên"].includes(vc),
              bI = ["< 0", "> 10", "Không phải số"].includes(bc),
              k = [];
            if (!vI && !bI) {
              if (vc == "0–3") k.push("Điểm: " + bc);
              k.push("Vắng: " + vc);
            } else if (!vI) k.push("Điểm: " + bc);
            else if (!bI) k.push("Vắng: " + vc);
            return k;
          },
          why: () => "sai kết quả mong đợi so với dữ liệu vào",
          lbl: (x) => "Lớp " + x,
        },
        bva: {
          c: "#0f9d6b",
          name: "2. Phân tích giá trị biên",
          spec: [
            "<b>Chức năng:</b> đăng ký bảo hiểm với 2 dữ liệu vào: <b>tuổi</b> là số nguyên từ 18 đến 60 và <b>số năm tham gia</b> là số nguyên từ 1 đến 20 (đều gồm hai đầu mút). Hợp lệ khi cả hai dữ liệu hợp lệ.",
            "<b>Yêu cầu:</b> áp dụng kỹ thuật phân tích giá trị biên: tự xác định các biên và cận biên cần kiểm thử của <b>từng</b> dữ liệu vào, mô tả ở cột đầu, điền giá trị và kết quả mong đợi. Khi kiểm thử biên của một dữ liệu, dữ liệu còn lại nên lấy giá trị hợp lệ.",
          ],
          cols: [
            {
              k: "a",
              l: "Biên / cận biên (tự xác định)",
              ph: "Mô tả giá trị này kiểm tra điều gì",
            },
            { k: "b", l: "Tuổi", ph: "Nhập giá trị" },
            { k: "d", l: "Số năm tham gia", ph: "Nhập giá trị" },
            { k: "c", l: "Kết quả mong đợi", sel: ["Hợp lệ", "Không hợp lệ"] },
          ],
          req: Object.keys(POS)
            .map((x) => "Tuổi " + x)
            .concat(Object.keys(POSY).map((x) => "Số năm " + x)),
          key: (r) => {
            const v = String(r.b).trim(),
              w = String(r.d).trim(),
              aV = bvaOK(v) == "Hợp lệ",
              yV = w !== "" && Number.isInteger(+w) && +w >= 1 && +w <= 20;
            if (r.c !== (aV && yV ? "Hợp lệ" : "Không hợp lệ")) return null;
            const k = [];
            if (POS[v] && yV) k.push("Tuổi " + v);
            if (POSY[w] && aV) k.push("Số năm " + w);
            return k.length || POS[v] || POSY[w] ? k : null;
          },
          why: (r) =>
            POS[String(r.b).trim()] || POSY[String(r.d).trim()]
              ? "sai kết quả mong đợi"
              : "không phải giá trị biên hoặc cận biên",
          lbl: (x) =>
            x + " (" + (x[0] == "T" ? POS[x.slice(5)] : POSY[x.slice(8)]) + ")",
        },
        dt: {
          c: "#f08c00",
          name: "3. Bảng quyết định",
          spec: [
            "<b>Chức năng:</b> tính giảm giá vé xem phim. C1: là thành viên (+10%) · C2: mua từ 3 vé trở lên (+5%) · C3: có mã khuyến mãi (+5%).",
            "Các mức giảm được cộng dồn, tối đa 15%.",
            "<b>Yêu cầu:</b> liệt kê đủ 8 luật (tổ hợp T/F của 3 điều kiện), mỗi luật 1 dòng, điền đúng mức giảm giá.",
          ],
          cols: [
            { k: "m", l: "C1 Thành viên", sel: ["T", "F"] },
            { k: "q", l: "C2 Từ 3 vé", sel: ["T", "F"] },
            { k: "c", l: "C3 Có mã KM", sel: ["T", "F"] },
            { k: "e", l: "Giảm giá", sel: ["0%", "5%", "10%", "15%"] },
          ],
          req: combos,
          key: (r) => (r.e === disc(r.m, r.q, r.c) ? [r.m + r.q + r.c] : null),
          why: () => "sai mức giảm giá",
          lbl: (x) => "Luật " + x.split("").join("/"),
        },
        eg: {
          c: "#9c36b5",
          name: "4. Đoán lỗi",
          spec: [
            "<b>Chức năng:</b> form đăng ký gồm Email, Mật khẩu (8–20 ký tự), Họ tên.",
            "<b>Yêu cầu:</b> dựa vào kinh nghiệm, viết ít nhất <b>8 test case khác nhau</b>, bao phủ từ <b>4 nhóm lỗi</b> trở lên. Mỗi test case phải đủ nhóm lỗi, dữ liệu/bước thực hiện và kết quả mong đợi.",
          ],
          cols: [
            {
              k: "a",
              l: "Nhóm lỗi",
              sel: [
                "Dữ liệu rỗng",
                "Ký tự đặc biệt / SQL injection",
                "Độ dài cực lớn / cực nhỏ",
                "Khoảng trắng",
                "Định dạng sai",
                "Unicode / tiếng Việt",
                "Thao tác UI (nhấn 2 lần, back)",
                "Trùng dữ liệu",
              ],
            },
            {
              k: "b",
              l: "Dữ liệu / bước thực hiện",
              ph: "VD: email = ' OR 1=1 --",
            },
            { k: "c", l: "Kết quả mong đợi", ph: "VD: Báo lỗi, không đăng ký" },
          ],
        },
      };
      const K = Object.keys(TABS);
      let S,
        cur = "ep",
        st = { info: {}, start: 0, done: 0, used: 0 },
        tm;
      const blank = () => {
        S = {};
        K.forEach((k) => (S[k] = [{}, {}, {}]));
      };
      blank();
      try {
        const d = JSON.parse(localStorage.getItem(KEY) || "null");
        if (d) {
          S = d.S;
          st = d.st;
        }
      } catch (e) {}
      const save = () => {
        try {
          localStorage.setItem(KEY, JSON.stringify({ S, st }));
        } catch (e) {}
      };
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const full = (T, r) =>
        T.cols.every((c) =>
          c.opt
            ? r[c.k] !== undefined
            : (r[c.k] || "").toString().trim() !== "",
        );
      function grade(k) {
        const T = TABS[k],
          rs = S[k];
        if (k == "eg") {
          const ok = [],
            seen = new Set();
          rs.forEach((r) => {
            if (full(T, r) && r.c.trim().length > 2) {
              const s = r.a + "|" + r.b.trim().toLowerCase();
              if (!seen.has(s)) {
                seen.add(s);
                ok.push(r);
              }
            }
          });
          const cats = new Set(ok.map((r) => r.a)),
            s = 5 * Math.min(1, ok.length / 8) + 5 * Math.min(1, cats.size / 4);
          return {
            s: +s.toFixed(1),
            got: [`${ok.length}/8 test case hợp lệ`, `${cats.size}/4 nhóm lỗi`],
            miss: [
              ...(ok.length < 8
                ? [
                    `Thiếu ${8 - ok.length} test case (đủ thông tin, không trùng)`,
                  ]
                : []),
              ...(cats.size < 4 ? [`Thiếu ${4 - cats.size} nhóm lỗi`] : []),
            ],
            bad: [],
          };
        }
        const got = new Set(),
          bad = [];
        rs.forEach((r, i) => {
          if (!full(T, r)) return;
          const xs = T.key(r);
          if (xs === null) bad.push(`TC${i + 1}: ${T.why(r)}`);
          else {
            const nw = xs.filter((x) => !got.has(x));
            if (xs.length && !nw.length) bad.push(`TC${i + 1}: trùng lặp`);
            nw.forEach((x) => got.add(x));
          }
        });
        const wrong = bad.length,
          s = Math.max(0, (10 * got.size) / T.req.length - 0.5 * wrong);
        return {
          s: +s.toFixed(1),
          got: [`${got.size}/${T.req.length} mục bao phủ đúng`],
          miss: T.req.filter((x) => !got.has(x)).map(T.lbl),
          bad,
        };
      }
      const rank = (s) =>
        s >= 9
          ? "Xuất sắc"
          : s >= 8
            ? "Giỏi"
            : s >= 6.5
              ? "Khá"
              : s >= 5
                ? "Trung bình"
                : "Chưa đạt";
      const fmt = (t) =>
        String(Math.floor(t / 60)).padStart(2, "0") +
        ":" +
        String(t % 60).padStart(2, "0");
      const left = () =>
        Math.max(0, TOTAL - Math.floor((Date.now() - st.start) / 1000));
      function start() {
        const i = ["nm", "id", "cl"].map((x) =>
          document.getElementById(x).value.trim(),
        );
        if (i.some((x) => !x)) {
          alert("Vui lòng nhập đủ họ tên, MSSV và lớp.");
          return;
        }
        st = {
          info: { nm: i[0], id: i[1], cl: i[2] },
          start: Date.now(),
          done: 0,
          used: 0,
        };
        blank();
        save();
        exam();
      }
      function home() {
        clearInterval(tm);
        app.innerHTML = `<main><div class="card" style="--c:#4263eb"><h2 style="margin:0 0 6px">Thông tin sinh viên</h2><div class="g"><input id="nm" placeholder="Họ và tên"><input id="id" placeholder="MSSV"><input id="cl" placeholder="Lớp"></div>
<ul><li>Thời gian làm bài <b>40 phút</b>, đồng hồ bắt đầu đếm ngược khi bấm "Bắt đầu".</li><li>4 bài tương ứng 4 kỹ thuật thiết kế test case, mỗi bài 2.5 điểm quy đổi từ thang 10.</li><li>Kết quả được hiển thị sau khi nộp bài hoặc hết giờ (hệ thống tự nộp).</li></ul><button class="bt" onclick="start()">▶ Bắt đầu làm bài</button></div></main>`;
      }
      function exam() {
        clearInterval(tm);
        const T = TABS[cur];
        app.innerHTML = `<div class="bar"><div><b>${esc(st.info.nm)}</b> · ${esc(st.info.id)} · ${esc(st.info.cl)}</div><div class="clock" id="ck"></div><button class="bt" style="--c:#d6336c" onclick="submit(0)">Nộp bài</button></div><main style="--c:${T.c}">
<div class="tabs">${K.map((k) => `<button class="tab ${k == cur ? "on" : ""}" style="--c:${TABS[k].c}" onclick="cur='${k}';exam()">${TABS[k].name}<small id="tb-${k}"></small></button>`).join("")}</div>
<div class="card sp"><b>Đề bài</b><ul>${T.spec.map((s) => "<li>" + s + "</li>").join("")}</ul></div>
<div class="card"><div class="tw"><table><thead><tr><th style="width:50px">ID</th>${T.cols.map((c) => "<th>" + c.l + "</th>").join("")}<th>Trạng thái</th><th style="width:40px"></th></tr></thead><tbody>
${S[cur].map((r, i) => `<tr><td><b>TC${String(i + 1).padStart(2, "0")}</b></td>${T.cols.map((c) => `<td>${c.sel ? `<select data-i="${i}" data-k="${c.k}"><option value="">--</option>${c.sel.map((o) => `<option ${r[c.k] === o ? "selected" : ""}>${o}</option>`).join("")}</select>` : `<input data-i="${i}" data-k="${c.k}" placeholder="${esc(c.ph)}" value="${esc(r[c.k])}">`}</td>`).join("")}<td class="st" id="s${i}"></td><td><button class="bt s" onclick="S[cur].splice(${i},1);save();exam()">✕</button></td></tr>`).join("")}</tbody></table></div>
<div class="r"><button class="bt" onclick="S[cur].push({});save();exam()">+ Thêm test case</button></div></div></main>`;
        app.querySelectorAll("[data-k]").forEach(
          (el) =>
            (el.oninput = el.onchange =
              () => {
                S[cur][+el.dataset.i][el.dataset.k] = el.value;
                save();
                upd();
              }),
        );
        upd();
        tick();
        tm = setInterval(tick, 1000);
      }
      function upd() {
        const T = TABS[cur];
        S[cur].forEach((r, i) => {
          const e = document.getElementById("s" + i);
          if (!e) return;
          const f = full(T, r),
            any = T.cols.some((c) => r[c.k]);
          e.className = "st " + (f ? "ok" : "");
          e.textContent = f ? "✓ Đã nhập đủ" : any ? "… Chưa đủ" : "—";
        });
        K.forEach((k) => {
          const n = S[k].filter((r) => full(TABS[k], r)).length;
          document.getElementById("tb-" + k).textContent = n + " test case";
        });
      }
      function tick() {
        const t = left(),
          e = document.getElementById("ck");
        if (e) {
          e.textContent = "⏱ " + fmt(t);
          e.className = "clock" + (t < 300 ? " w" : "");
        }
        if (t <= 0) submit(1);
      }
      function submit(auto) {
        if (
          !auto &&
          !confirm("Bạn chắc chắn muốn nộp bài? Sau khi nộp sẽ không thể sửa.")
        )
          return;
        st.used = Math.min(TOTAL, Math.floor((Date.now() - st.start) / 1000));
        st.done = 1;
        save();
        result();
      }
      function result() {
        clearInterval(tm);
        const R = K.map((k) => ({ k, ...grade(k) })),
          avg = R.reduce((a, x) => a + x.s, 0) / 4,
          sc = +avg.toFixed(2);
        app.innerHTML = `<main><div class="card" style="--c:#4263eb"><h2 style="margin:0 0 8px">Kết quả bài kiểm tra LAB 3&4</h2><div class="sc"><div class="big">${sc.toFixed(1)}</div><div><div style="font-size:20px"><b>Xếp loại: ${rank(avg)}</b></div><div>${esc(st.info.nm)} · MSSV ${esc(st.info.id)} · Lớp ${esc(st.info.cl)}</div><div style="color:var(--mu)">Thời gian làm bài: ${fmt(st.used)} / ${fmt(TOTAL)}${st.used >= TOTAL ? " (hết giờ, tự động nộp)" : ""}</div></div></div></div>
${R.map((x) => {
  const T = TABS[x.k];
  return `<div class="card rc" style="--c:${T.c}"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${T.name}</h3><span class="tag">${x.s.toFixed(1)}/10</span></div><div class="pb"><i style="width:${x.s * 10}%"></i></div>
<div><b class="ok">Đạt được:</b> ${x.got.join(" · ")}</div>${x.miss.length ? `<div><b class="er">Còn thiếu:</b><ul>${x.miss.map((m) => "<li>" + esc(m) + "</li>").join("")}</ul></div>` : '<div class="ok">✓ Đã bao phủ đầy đủ.</div>'}${x.bad.length ? `<div><b class="er">Test case sai (trừ 0.5 điểm/lỗi):</b><ul>${x.bad.map((m) => "<li>" + esc(m) + "</li>").join("")}</ul></div>` : ""}</div>`;
}).join("")}
<button class="bt s" onclick="if(confirm('Làm bài mới? Kết quả hiện tại sẽ bị xóa.')){try{localStorage.removeItem(KEY)}catch(e){}st={info:{},start:0,done:0,used:0};blank();home()}">Làm bài mới</button></main>`;
      }
      if (st.done) result();
      else if (st.start) {
        left() <= 0 ? submit(1) : exam();
      } else home();
    </script>
  </body>
</html>
